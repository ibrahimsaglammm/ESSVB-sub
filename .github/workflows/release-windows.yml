name: Build & Release Windows 11 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build single-file Windows 11 EXE & verify self-check
        shell: pwsh
        run: ./build-windows-exe.ps1

      - name: Run Release unit tests
        shell: pwsh
        run: dotnet test ESSVB-sub.slnx -c Release

      - name: Upload Windows 11 EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESSVB-sub-win11-x64
          path: |
            dist/ESSVB-sub-v*-win11-x64.exe
            dist/ESSVB-sub-v*-win11-x64.exe.sha256

      - name: Attach Windows 11 EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ESSVB-sub-v*-win11-x64.exe
            dist/ESSVB-sub-v*-win11-x64.exe.sha256
